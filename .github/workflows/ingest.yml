name: CT Ingest

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: ct-ingest
  cancel-in-progress: false

permissions: read-all

jobs:
  ingest:
    name: Poll CT sources
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run CT ingest pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
          DIRECT_CT_LOGS_PER_RUN: 6
          DIRECT_CT_ENTRIES_PER_LOG: 128
          STATIC_CT_MAX_TILES_PER_LOG: 30
          STATIC_CT_MAX_RUN_MS: 90000
        run: node scripts/run-ingest.mjs
