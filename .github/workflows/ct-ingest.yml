name: CT Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ct-ingest
  cancel-in-progress: true

permissions: read-all

jobs:
  poll-certstream:
    name: Poll CertStream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Poll and ingest CT events
        env:
          INGEST_URL: https://sgcertwatch.vercel.app/api/ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CERTSTREAM_URL: wss://certstream.calidog.io/
          RUN_SECONDS: "240"
          BATCH_SIZE: "25"
        run: npm run poll:certstream
