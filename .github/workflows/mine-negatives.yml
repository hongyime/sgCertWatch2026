name: Mine Extended Negatives

on:
  workflow_dispatch:
    inputs:
      target_negatives:
        description: "Target total negatives in extended sample (default: 600000)"
        required: false
        default: "600000"
  schedule:
    - cron: "0 4 1 * *"

permissions: read-all

jobs:
  mine:
    name: Mine CT log entries for extended negatives
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Mine negatives from CT logs
        env:
          TARGET_NEGATIVES: ${{ inputs.target_negatives || '600000' }}
          BATCH_SIZE: "2048"
          SAMPLE_WINDOW_PER_LOG: "4000000"
          MAX_WINDOWS_PER_LOG: "3"
          PROGRESS_EVERY: "25000"
          SYNC_CORPUS: "0"
        run: node scripts/mine_extended_negatives.mjs

      - name: Upload extended negatives artifact
        uses: actions/upload-artifact@v4
        with:
          name: extended-negatives-jsonl
          path: fixtures/corpus/extended_negatives.jsonl
          retention-days: 14

      - name: Commit extended negatives checkpoint if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SIZE_BYTES=$(wc -c < fixtures/corpus/extended_negatives.jsonl)
          MAX_BYTES=$((95 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "Extended negatives file is ${SIZE_BYTES} bytes; skipping commit to stay below GitHub's 100 MB file limit."
            exit 0
          fi
          git add fixtures/corpus/extended_negatives.jsonl
          if git diff --cached --quiet; then
            echo "No new entries mined."
          else
            COUNT=$(wc -l < fixtures/corpus/extended_negatives.jsonl)
            git commit -m "data(corpus): extend negative sample to ${COUNT} entries (H-3)"
            git push
          fi
