name: Threat Intel Enrichment

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      scheduler:
        description: "Dispatch origin"
        type: choice
        options: [manual, cloudflare]
        default: manual

concurrency:
  group: threat-intel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Enrich CT candidates within provider budgets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          INTEL_MIN_INTERVAL_MS: 3300000
          SCHEDULER_TRIGGER: ${{ inputs.scheduler || 'github' }}
        run: node scripts/run-intel.mjs
