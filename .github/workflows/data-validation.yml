name: Data Validation

on:
  pull_request:
    branches: [main, master]
    paths:
      - "watchlist.json"
      - "keywords.json"
      - "allowlist.json"
      - "schemes.json"
      - "scripts/validate_data.py"
      - ".github/workflows/data-validation.yml"
  push:
    branches: [main, master]
    paths:
      - "watchlist.json"
      - "keywords.json"
      - "allowlist.json"
      - "schemes.json"
      - "scripts/validate_data.py"
      - ".github/workflows/data-validation.yml"
  workflow_dispatch:
    inputs:
      release_readiness:
        description: "Fail unless all allowlist and scheme entries are verified"
        required: false
        default: false
        type: boolean

concurrency:
  group: data-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    name: Validate seed data structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate JSON data
        run: python scripts/validate_data.py

  release-readiness:
    name: Check launch readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_readiness
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Require verified launch data
        run: python scripts/validate_data.py --release
