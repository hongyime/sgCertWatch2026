name: Data Validation

on:
  pull_request:
    branches: [main, master]
    paths:
      - "watchlist.json"
      - "keywords.json"
      - "allowlist.json"
      - "schemes.json"
      - "scripts/validate_data.py"
      - "scripts/test_*.js"
      - "scripts/test_*.mjs"
      - "scripts/test_*.sql"
      - "scripts/test_*.py"
      - "scripts/verify_*.mjs"
      - "scripts/test_intel*"
      - "app.js"
      - "refresh.js"
      - "index.html"
      - "styles.css"
      - "favicon.svg"
      - "vercel.json"
      - "api/**"
      - "supabase/**"
      - ".github/workflows/intel.yml"
      - "lib/**"
      - "scheduler/**"
      - "scripts/run-*.mjs"
      - "package*.json"
      - ".github/workflows/ingest.yml"
      - ".github/workflows/notifications.yml"
      - ".github/workflows/data-validation.yml"
  push:
    branches: [main, master]
    paths:
      - "watchlist.json"
      - "keywords.json"
      - "allowlist.json"
      - "schemes.json"
      - "scripts/validate_data.py"
      - "scripts/test_*.js"
      - "scripts/test_*.mjs"
      - "scripts/test_*.sql"
      - "scripts/test_*.py"
      - "scripts/verify_*.mjs"
      - "scripts/test_intel*"
      - "app.js"
      - "refresh.js"
      - "index.html"
      - "styles.css"
      - "favicon.svg"
      - "vercel.json"
      - "api/**"
      - "supabase/**"
      - ".github/workflows/intel.yml"
      - "lib/**"
      - "scheduler/**"
      - "scripts/run-*.mjs"
      - "package*.json"
      - ".github/workflows/ingest.yml"
      - ".github/workflows/notifications.yml"
      - ".github/workflows/data-validation.yml"
  workflow_dispatch:
    inputs:
      release_readiness:
        description: "Fail unless all allowlist and scheme entries are verified"
        required: false
        default: false
        type: boolean

concurrency:
  group: data-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    name: Validate seed data structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: notification_outbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate JSON data
        run: python scripts/validate_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test core pipeline
        run: npm run test:unit

      - name: Test intelligence contracts
        run: npm run test:intel

      - name: Test reliability and external scheduler
        env:
          OUTBOX_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/notification_outbox_test
        run: npm run test:reliability

      - name: Test PostgreSQL lease contention and fencing
        env:
          OUTBOX_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/notification_outbox_test
        run: node scripts/test_run_lock_postgres.mjs

      - name: Test lossless index maintenance
        env:
          INDEX_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/notification_outbox_test
        run: |
          python scripts/test_index_cleanup.py
          python scripts/test_source_index_cleanup.py

      - name: Install browser for dashboard verification
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile dashboard flows
        run: node scripts/test_intel_ui.mjs

  release-readiness:
    name: Check launch readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_readiness
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Require verified launch data
        run: python scripts/validate_data.py --release
