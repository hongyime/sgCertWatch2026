name: Evidence object contract
on:
  pull_request:
    paths: ['lib/storage/**', 'supabase/experimental/evidence-manifests.sql', 'scripts/test_evidence_*.mjs', '.github/workflows/evidence-objects.yml']
  push:
    branches: [main]
    paths: ['lib/storage/**', 'supabase/experimental/evidence-manifests.sql', 'scripts/test_evidence_*.mjs', '.github/workflows/evidence-objects.yml']
permissions:
  contents: read
concurrency:
  group: evidence-objects-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: prawn_evidence_fixture_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EVIDENCE_TEST_DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/prawn_evidence_fixture_ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/test_evidence_objects.mjs
      - run: node --test scripts/test_evidence_postgres.mjs
        env:
          EVIDENCE_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
