name: Allowlist Source Expiry

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions: read-all

jobs:
  verify:
    name: Verify allowlist sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify tiers (no network)
        run: python scripts/verify_allowlist.py --skip-network

      - name: Probe allowlist source URLs
        id: probe
        run: |
          if python scripts/verify_allowlist.py; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on stale sources
        if: steps.probe.outputs.result == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["allowlist", "maintenance"],
              title: `Allowlist source expiry detected (${new Date().toISOString().slice(0, 10)})`,
              body: "One or more verified allowlist source URLs became unreachable. Run `python scripts/verify_allowlist.py` locally for the full list, re-verify each domain against an official source, and update or purge the entries."
            });
