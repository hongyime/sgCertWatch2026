<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Singapore Certificate Transparency watchlist dashboard">
    <title>sgCertWatch</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Certificate Transparency</p>
        <h1>sgCertWatch</h1>
      </div>
      <div class="status" id="data-status">Loading data</div>
    </header>

    <main>
      <section class="summary" aria-label="Dataset summary">
        <article>
          <span id="brand-count">-</span>
          <p>Watched brands</p>
        </article>
        <article>
          <span id="keyword-count">-</span>
          <p>Suspicious keywords</p>
        </article>
        <article>
          <span id="allowlist-count">-</span>
          <p>Verified allowlist entries</p>
        </article>
        <article>
          <span id="scheme-count">-</span>
          <p>Government schemes</p>
        </article>
      </section>

      <section class="toolbar" aria-label="Filters">
        <label class="search">
          <span>Search</span>
          <input id="search" type="search" placeholder="brand, token, category, domain">
        </label>
        <label>
          <span>Category</span>
          <select id="category-filter">
            <option value="">All categories</option>
          </select>
        </label>
        <label>
          <span>Dataset</span>
          <select id="dataset-filter">
            <option value="brands">Brands</option>
            <option value="allowlist">Allowlist</option>
            <option value="schemes">Schemes</option>
          </select>
        </label>
      </section>

      <section class="split">
        <div>
          <div class="section-heading">
            <h2 id="table-title">Brands</h2>
            <span id="result-count">0 results</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </div>

        <aside class="panel" aria-label="Release readiness">
          <h2>Release Readiness</h2>
          <dl>
            <div>
              <dt>Allowlist</dt>
              <dd id="allowlist-status">-</dd>
            </div>
            <div>
              <dt>Schemes</dt>
              <dd id="scheme-status">-</dd>
            </div>
            <div>
              <dt>Pending review</dt>
              <dd id="pending-status">-</dd>
            </div>
          </dl>
          <div class="pending">
            <h3>Pending Candidates</h3>
            <ul id="pending-list"></ul>
          </div>
        </aside>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
